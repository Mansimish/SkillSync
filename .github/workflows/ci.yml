name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: skillsync
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: skillsync_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillsync -d skillsync_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://skillsync:ci-only-password@localhost:5432/skillsync_test
      TEST_POSTGRES_URL: postgresql+psycopg://skillsync:ci-only-password@localhost:5432/skillsync_test
      JWT_SECRET: ci-only-secret-not-for-real-deployment-at-least-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - name: Enable vector in the disposable CI database
        run: python -c "import os, psycopg; c=psycopg.connect(os.environ['TEST_POSTGRES_URL'].replace('postgresql+psycopg://','postgresql://'), autocommit=True); c.execute('CREATE EXTENSION IF NOT EXISTS vector'); c.close()"
      - run: python -m pytest tests -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build image
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-secret-not-for-real-deployment-at-least-32-characters
          GEMINI_API_KEY: ci-only-placeholder-key
        run: |
          docker compose config --quiet
          docker build -f backend/Dockerfile -t skillsync:ci .
