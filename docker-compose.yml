name: skillsync
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: skillsync
      POSTGRES_USER: skillsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsync -d skillsync"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: skillsync-local
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &app-environment
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://skillsync:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/skillsync
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      FRONTEND_ORIGIN: http://localhost:8000
      AUTH_COOKIE_SECURE: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in root .env}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      RAG_VECTOR_BACKEND: pgvector
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: skillsync-local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - resumes:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  resumes:
